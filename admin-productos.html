<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrar servicios · NutriVida</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="fondo-admin">
  <header class="encabezado-admin"><div class="container py-3 d-flex justify-content-between align-items-center gap-3"><a class="marca-nv" href="admin.html"><span class="hoja-icono">◆</span> NutriVida <small class="etiqueta-admin">Administración</small></a><div class="d-flex align-items-center gap-3"><span class="texto-sesion" data-usuario-sesion></span><button type="button" class="btn btn-sm btn-outline-light" data-cerrar-sesion>Cerrar sesión</button></div></div></header>
  <main class="seccion"><div class="container"><div class="row g-4"><aside class="col-lg-3"><nav class="menu-admin" aria-label="Menú administrativo"><p class="menu-admin-titulo">Gestión del sistema</p><a href="admin.html">Resumen</a><a class="activo" href="admin-productos.html">Productos y servicios</a><a href="admin-usuarios.html">Usuarios</a><a href="productos.html">Ver tienda pública</a></nav></aside><section class="col-lg-9"><h1 class="titulo-seccion">Productos y servicios</h1><p class="intro-seccion">Mantén actualizado el catálogo visible para los pacientes.</p><div id="mensaje-producto-admin" role="alert"></div><form id="formulario-producto-admin" class="tarjeta-formulario mb-4" novalidate><h2 id="titulo-formulario-producto" class="h4 mb-3">Nuevo servicio o plan</h2><div class="row"><div class="col-md-4 mb-3"><label for="admin-producto-codigo" class="form-label">Código producto</label><input id="admin-producto-codigo" class="form-control" type="text" minlength="3" required><div class="invalid-feedback"></div></div><div class="col-md-4 mb-3"><label for="admin-producto-tipo" class="form-label">Categoría</label><select id="admin-producto-tipo" class="form-select" required><option value="">Selecciona una categoría</option><option>Consulta</option><option>Plan especializado</option><option>Evaluación</option><option>Taller grupal</option></select><div class="invalid-feedback"></div></div><div class="col-md-4 mb-3"><label for="admin-producto-nombre" class="form-label">Nombre</label><input id="admin-producto-nombre" class="form-control" maxlength="100" required><div class="invalid-feedback"></div></div></div><div class="row"><div class="col-md-4 mb-3"><label for="admin-producto-duracion" class="form-label">Duración</label><input id="admin-producto-duracion" class="form-control" maxlength="30" placeholder="Ej: 30 min"><div class="invalid-feedback"></div></div><div class="col-md-4 mb-3"><label for="admin-producto-modalidad" class="form-label">Modalidad</label><input id="admin-producto-modalidad" class="form-control" maxlength="80" value="Presencial" required><div class="invalid-feedback"></div></div><div class="col-md-4 mb-3"><label for="admin-producto-profesional" class="form-label">Profesional</label><input id="admin-producto-profesional" class="form-control" maxlength="100" value="Nutricionista" required><div class="invalid-feedback"></div></div></div><div class="row"><div class="col-md-4 mb-3"><label for="admin-producto-precio" class="form-label">Precio (CLP)</label><input id="admin-producto-precio" class="form-control" type="number" min="0" step="0.01" required><div class="invalid-feedback"></div></div><div class="col-md-4 mb-3"><label for="admin-producto-stock" class="form-label">Stock</label><input id="admin-producto-stock" class="form-control" type="number" min="0" step="1" value="0" required><div class="invalid-feedback"></div></div><div class="col-md-4 mb-3"><label for="admin-producto-stock-critico" class="form-label">Stock crítico</label><input id="admin-producto-stock-critico" class="form-control" type="number" min="0" step="1" value="0"><div class="invalid-feedback"></div></div></div><div class="mb-3"><label for="admin-producto-imagen" class="form-label">Imagen (opcional)</label><input id="admin-producto-imagen" class="form-control" type="url" placeholder="https://..." maxlength="300"><div class="invalid-feedback"></div></div><div class="mb-3"><label for="admin-producto-descripcion" class="form-label">Descripción (opcional)</label><textarea id="admin-producto-descripcion" class="form-control" maxlength="500" rows="3"></textarea><div class="invalid-feedback"></div></div><div class="d-flex gap-2 flex-wrap"><button type="submit" class="btn btn-nv-primario">Guardar servicio</button><button type="button" id="cancelar-edicion-producto" class="btn btn-nv-secundario d-none">Cancelar edición</button></div></form><div class="tabla-responsive"><table class="table tabla-admin align-middle"><caption class="visually-hidden">Listado de servicios del catálogo</caption><thead><tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead><tbody id="tabla-productos-admin"></tbody></table></div></section></div></div></main>
  <script src="js/catalogo.js"></script><script src="js/almacenamiento.js"></script><script src="js/validaciones.js"></script><script src="js/admin.js"></script>
</body>
</html>
